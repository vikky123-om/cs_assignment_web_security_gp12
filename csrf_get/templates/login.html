{% extends "base.html" %}
{% block title %}Login – CSRF GET Demo{% endblock %}
{% block content %}
<div class="card">
  <h2>Account Login</h2>
  <form method="POST">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" placeholder="e.g. alice" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="e.g. alice_pass" required>

    <button type="submit" class="btn btn-primary">Login</button>
  </form>
</div>
{% endblock %}
